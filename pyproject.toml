[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphred"
version = "0.1.0"
description = "Priority-queue middleware + state machine wrapper over Hermes Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "textual>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
alphred = "alphred.cli:main"

[tool.setuptools.packages.find]
include = ["alphred*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
